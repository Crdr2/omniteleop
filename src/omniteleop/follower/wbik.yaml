# Whole-body IK, joystick control, and recording parameters.
# The bundled model preserves joint/inertial data and collision-origin metadata.
urdf_path: "${omniteleop}/assets/vega_with_robotiq.urdf"

# End-effector task weights set the scale for other costs.
ee_position_cost: 10000.0
ee_orientation_cost: 10000.0
lm_damping_ee: 1.0e-5

# Base velocity damping. The planar root structurally fixes z/roll/pitch.
base_position_cost: [10000.0, 10000.0, 0.0]  # x/y: hand-only shifts prefer arms; z: no-op
base_orientation_cost: [0.0, 0.0, 10000.0]   # roll/pitch: no-ops; yaw stiff like x/y
# Base-task Levenberg-Marquardt damping.
lm_damping_base: 1.0e-6

# Penalize base-twist changes, not steady translation or rotation.
base_velocity_smoothing_cost: [0.0, 0.0, 4000.0] # per-axis (vx, vy, wz)

# Planar base DOFs available to WBC. "xy_yaw" allows x/y translation and yaw rotation;
# "xy" hard-locks yaw in the QP so WBC can translate the base but cannot rotate it.
base_dofs: "xy_yaw"

# Nominal-posture weights: prefer arm motion before torso motion.
posture_cost_torso: 200
posture_cost_arm: 10
posture_cost_head: 0.0

# Current-posture weights damp joint velocity without changing the nominal target.
current_posture_cost_main: 10   # torso + arms velocity damping
current_posture_cost_head: 0.0

# Head tracking uses live whole-body FK and optical-axis direction only.
# Gain is in 1/s; the caller interpolates/smooths headset commands.
# Body-motion compensation is immediate and steps obey joint velocity limits.
head_ik_gain: 100.0
# Damped-LS regularization of the solve_head step. Pure conditioning (smoothing comes
# from head_ik_gain): bounds the 2-DOF step when the pan/tilt axes degenerate against
# the orientation error near the joint-range extremes.
head_ik_damp: 1.0e-2

# Head modes: track uses solve_head; ik couples base/torso/head in the QP;
# fixed holds nominal joints. Joystick followers use joystick_teleop.head_mode.
head_mode: "ik"
# Head FrameTask weights in ik mode; unactuated camera roll remains a residual.
head_position_cost: 0.0
head_orientation_cost: [10000.0, 10000.0, 10000.0]
# World-axis position weights in ik mode. Zero z frees torso height without
# coupling vertical motion into the pitched optical frame's fore/aft axis.
head_world_position_cost: [10000.0, 10000.0, 0.0]
# Pin these head joints in ik mode; other head joints stay available to the QP.
# Track/fixed modes pin all head joints independently of this list.
head_ik_pinned_joints: ["head_j1", "head_j2"]

# Keep torso FK/collision geometry but pin torso velocities when true.
lock_torso_in_ik: true

# Hard-pin arm_center to its nominal base-frame x while leaving torso height
# and pitch free. Redundant when lock_torso_in_ik is true.
enable_torso_top_x_anchor: true
# Anchor recovery gain (1/s); correction is clipped to velocity headroom
# so measured-state recovery cannot make the equality infeasible.
torso_top_x_anchor_gain: 100.0

base_xy_max_vel: 1.0  # m/s
base_yaw_max_vel: 1.0 # rad/s
velocity_limit_scale: 0.9

# Single-axis base motion (one pure chassis motion per tick)
# The QP resolves leader/EE-target noise into small simultaneous vx/vy/wz, so a "drive
# straight" leans sideways, an in-place turn wanders, and a meant-to-be-still base creeps.
# When enabled, solve() keeps only the single dominant base axis (vx XOR vy XOR wz) and
# zeroes the other two -- and zeroes all three when the base is quiet -- so each chassis
# command is a pure forward, strafe, or yaw motion. (Distinct from the vr_teleop: deadbands,
# which shape the already-chosen command follower-side.)
enable_base_single_axis: true
# Quiet floor on the dominant axis, as a fraction of the base velocity cap: |vx|,|vy| /
# base_xy_max_vel and |wz| / base_yaw_max_vel compare on this common scale; below it the base
# is held still (all three zeroed). The solver's "is the base meant to move at all" gate.
# episode_2_debug showed the old 0.04 floor waking many near-threshold steering bursts;
# 0.06 removes most of those while preserving the deliberate strafe/forward segments.
base_single_axis_deadband: 0.06
# Follower-side floor after measured-base PD and slew limiting, on the same normalized
# scale. Lower than the intent gate so a valid command's acceleration ramp is dispatched
# instead of being chopped back to zero until it reaches 0.06.
base_dispatch_single_axis_deadband: 0.0
# Relative hysteresis on the axis choice: retain the previously active axis unless a
# different axis beats it by this fraction, so two near-equal axes don't chatter the chassis
# between (say) forward and turn at 100 Hz. 0 disables (pure per-tick argmax).
base_single_axis_hysteresis_ratio: 0.2

solver: "daqp"
damping: 1.0e-6

# Safety: self-collision avoidance
# Two layers reproduce RBY1's two-distance mink CollisionAvoidanceLimit
# (safety_distance 0.01 hard / influence_distance 0.02 soft) on the pink backend:
# a proactive SelfCollisionBarrier CBF in the QP (safe_dist) plus the reactive
# SafetyGate hold as the hard backstop (floor).
enable_collision_avoidance: true
# The iPhone ARKit mount above the left E-stop (hardware/vega_iphone_mount): 33 spheres
# cover the wide pedestal and thin cradle/phone/top-stop envelope, with 2 mm assembly
# padding (whole_body_ik.PHONE_MOUNT_PROXY_SPHERES). Both arms keep clear in every
# follower. false only for a robot without the mount.
phone_mount_collision: true
# Use the body-only sphere URDF. The solver adds Robotiq, wrist-camera, and
# phone-mount proxies; the Dexmate gripper sphere model is a different geometry.
collision_spheres_urdf: "${dexmate_urdf}/robots/humanoid/vega_1/vega_1_collision_spheres.collision.urdf"
# CBF separation target (m): the barrier asymptotically forbids cross-group sphere
# pairs closer than this. QP SelfCollisionBarrier's d_min
self_collision_safe_dist: 0.02 # will give ~0.04m in real robot, should be enough
# Reactive hard floor (m): a step below this distance that is also *worsening* is
# held (joints freeze; the base may keep moving).
self_collision_floor: 0.01
self_collision_warn_dist: 0.03 # only for HUD warning, not for QP
# Build-time SRDF-style filter: drop cross-group sphere pairs closer than this at the
# nominal posture (the by-design shoulder-in-torso overlaps), so the barrier starts
# feasible. No RBY1 counterpart -- its hand-curated geom groups never form such pairs.
nominal_pair_keep_dist: 0.07 # nominal overlap filter (m)
# Number of closest sphere pairs constrained per solve (QP rows).
n_collision_pairs: 120
# CBF gain (h_dot >= -gain*h): shapes how fast pairs may approach safe_dist.
# pink-only; RBY1's mink velocity damper has no gain knob.
collision_barrier_gain: 1.0
# 0 drops pink's "safe backup velocity" objective term (it otherwise biases the
# redundancy resolution and stalls the base mid-maneuver. Mink has no such term.
collision_safe_displacement_gain: 0.0

# Safety: tip-over (CoM-over-base: hard QP inequality + soft centering)
# Ports RBY1's _add_com_over_base_xy_inequalities: the QP bounds the centroid proxy's
# horizontal over-base offset within +/-com_safety_margin of its value at the config
# nominal posture, so the robot keeps moving while staying upright (no reactive stop).
enable_com_safety: true  # Vega-only switch (RBY1: active when com_over_base_xy_bounds is set)
# Soft base-frame xy centroid centering; vertical motion stays free.
# The hard stability box remains the safety backstop.
com_over_base_pos_cost: 100000.0
# Centroid proxy whose over-base offset is bounded: the top torso link frame origin,
# like RBY1's hardcoded "link_torso_5" lean proxy. "com" swaps in the true whole-body
# centre of mass (Vega extension).
com_centroid: "torso_l3"
# Box half-width (m), applied to both axes. Follows RBY1 com_over_base_xy_bounds:
# [0.08, 0.08]. Also reused by the (Mink-backend) reactive gate as its minimum
# CoM-inside-support-polygon margin.
com_safety_margin: 0.08

# joints not listed default to 0.
# The tip-over box above is anchored at this posture.
#
# Torso + arms reproduce the operational pose of dexcontrol's
# `examples/advanced_examples/fold_robot.py --unfold` so the WBC's redundancy
# resolution rests at the same configuration the robot powers up into.
nominal_posture:
  torso_j1: 0.78 # 0.5235987755982988    # pi/6
  torso_j2: 1.5707963267948966 # 1.0471975511965976    # pi/3
  torso_j3: 0.0 # 0.39269908169872414   # pi/8
  # Nominal head_j1 sets the camera down-look; head_j2/j3 are pan/tilt.
  # Keep leader calibration and follower nominal posture synchronized.
  head_j1: -0.25
  L_arm_j1: 0.844    # L_shape 0.064 + torso pitch 0.78
  L_arm_j2: 0.3      # L_shape
  L_arm_j4: -1.556   # L_shape
  L_arm_j5: 1.271    # L_shape
  R_arm_j1: -0.844   # L_shape -0.064 - torso pitch 0.78
  R_arm_j2: -0.3     # L_shape
  R_arm_j4: -1.556   # L_shape
  R_arm_j5: -1.271   # L_shape

# Shared leader/follower control-loop parameters; loaded separately from WBCConfig.
vr_teleop:
  # Replay speed multiplier (<1 = slower). The staged bring-up replays sim takes slowly.
  replay_speed: 0.5
  # IK and command rates in Hz. cmd_rate=0 disables interpolation;
  # otherwise leader and follower must use the same command rate.
  ik_rate: 100.0
  cmd_rate: 10.0
  # Shared full-scale thumbstick mapping for both VR leaders. Joystick followers also
  # use these maxima to normalize received base intent before single-axis projection.
  stick_max_vx: 0.3
  stick_max_vy: 0.3
  stick_max_wz: 0.5
  stick_deadzone: 0.1
  # Head-target first-order low-pass time constant (s) before IK; suppresses headset dither
  # that would otherwise resolve into base yaw in head_mode "ik". 0 disables.
  head_lpf_tau: 0.35
  # Planar head-target deadband: radial x/y (m) and heading-yaw (rad) held at the nominal
  # anchor so small headset drift does not wake the base, while larger motion passes through
  # (direction-preserving).
  head_planar_pos_deadband: 0.04
  head_planar_yaw_deadband: 0.30 # rad
  # Base pose-error feedback gains; velocity limits apply after feedback.
  base_kp_xy: 1.0
  base_kp_yaw: 1.5
  # When base_dofs is "xy", WBC yaw stays hard-locked in the QP, but closed-loop odometry
  # may still command a small wz to hold the robot's measured yaw against wheel/ground drift.
  base_yaw_hold_in_xy: true
  # Pre-shaping base deadband (m/s; angular threshold is twice this value).
  base_deadband: 0.01
  # Base-twist slew limit (m/s^2; angular = 2x), applied by base_closed_loop.shape_twist.
  base_accel: 0.4
  # Commanded linear-speed cap (m/s; angular cap is twice this value).
  # The IK solver caps above remain separate from the actuator command limits.
  base_max_speed: 0.45
  # Post-slew tail cut at starts/stops/axis switches (m/s and rad/s).
  # Single-axis selection upstream owns cross-axis suppression.
  base_post_linear_deadband: 0.01
  base_post_angular_deadband: 0.04

# Joystick-pipeline-only axis switching policy.
joystick_teleop:
  # Joystick head policy: track follows headset pan/tilt; fixed holds nominal.
  # This overrides the top-level head_mode.
  head_mode: "fixed"
  # Direction-only base control: once a stick direction passes the deadband and wins
  # single-axis selection, translation uses one fixed speed and yaw uses another.
  # Stick magnitude does not modulate chassis speed.
  translation_speed: 0.18  # m/s
  rotation_speed: 0.30     # rad/s
  # Joystick direction is explicit operator intent: switch axes immediately instead of
  # retaining the previous axis with the QP-noise hysteresis used by WBC base motion.
  single_axis_hysteresis_ratio: 0.0
  # Maximum pose-reference lead over measured base pose (m and rad).
  # Bounds catch-up after blocked/slipping motion; zero gives pure velocity control.
  reference_lead_xy: 0.05
  reference_lead_yaw: 0.10

# Optional --torso-stick speed, shared by leader and follower (m/s).
# Torso height follows the crouch path and hand targets move with it.
joystick_torso:
  # Direction-only, like the base: past the stick deadzone the height moves at this fixed
  # speed (m/s); stick magnitude is ignored.
  speed: 0.05
